<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poultry Disease Classifier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .container { max-width: 600px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        h1 { color: #0d6efd; text-align: center; margin-bottom: 30px; }
        #preview { max-width: 100%; margin-top: 20px; border-radius: 5px; display: none; }
        .result-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 5px; text-align: center; font-weight: bold; font-size: 1.2em; display: none;}
    </style>
</head>
<body>

<div class="container">
    <h1>🐔 Poultry Disease Check</h1>
    
    <div class="mb-3">
        <label for="imageUpload" class="form-label">Upload Chicken Fecal Image</label>
        <input class="form-control" type="file" id="imageUpload" accept="image/*">
    </div>

    <img id="preview" src="#" alt="Image Preview" />

    <div class="d-grid gap-2 mt-3">
        <button class="btn btn-primary btn-lg" onclick="uploadAndPredict()">Predict Disease</button>
    </div>

    <div id="result" class="result-box"></div>
</div>

<script>
    // Show image preview
    document.getElementById('imageUpload').onchange = function (evt) {
        var tgt = evt.target || window.event.srcElement,
            files = tgt.files;
        
        if (FileReader && files && files.length) {
            var fr = new FileReader();
            fr.onload = function () {
                var preview = document.getElementById('preview');
                preview.src = fr.result;
                preview.style.display = 'block';
            }
            fr.readAsDataURL(files[0]);
        }
    }

    // Send to Flask App
    async function uploadAndPredict() {
        let fileInput = document.getElementById('imageUpload');
        let formData = new FormData();
        formData.append("image", fileInput.files[0]);

        let response = await fetch('/predict', {
            method: "POST",
            body: formData
        });

        let result = await response.json();
        let resultBox = document.getElementById('result');
        resultBox.style.display = 'block';
        resultBox.innerText = "Prediction: " + result[0].image;
        
        if(result[0].image === "Healthy") {
            resultBox.style.color = "green";
        } else {
            resultBox.style.color = "red";
        }
    }
</script>

</body>
</html>
